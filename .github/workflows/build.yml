name: Android CI
on:
push:
branches: [ "main" ]
workflow_dispatch: # ඔබට අවශ්‍ය වෙලාවට manually build එක run කරන්න මේක උදව් වෙනවා
jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v3
- name: Set up JDK 17
uses: actions/setup-java@v3
with:
java-version: '17'
distribution: 'temurin'
- name: Setup Gradle
uses: gradle/actions/setup-gradle@v3
- name: Build APK without wrapper
run: gradle assembleDebug
- name: Upload APK
uses: actions/upload-artifact@v3
with:
name: KeepAlive-App-Debug
path: app/build/outputs/apk/debug/app-debug.apk
