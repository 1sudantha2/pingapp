name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Build debug + release APKs
        run: gradle --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk "artifacts/PingBooster-${GITHUB_RUN_NUMBER}-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/PingBooster-${GITHUB_RUN_NUMBER}-debug.apk"
          cd artifacts
          sha256sum *.apk | tee SHA256SUMS.txt
          ls -la

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: PingBooster-APK
          path: artifacts/*
          if-no-files-found: error
          retention-days: 90

      - name: Attach APKs to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
